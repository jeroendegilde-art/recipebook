<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="#1e3a2f"/>

  <!-- Open book shadow -->
  <ellipse cx="256" cy="342" rx="155" ry="12" fill="#152b22"/>

  <!-- Left page -->
  <path d="M 108 172 L 108 322 Q 108 333 120 334 L 250 334 L 250 163 Q 200 158 155 163 Q 128 167 108 172 Z" fill="#f0ede6"/>

  <!-- Right page (slightly lighter) -->
  <path d="M 262 163 L 262 334 L 392 334 Q 404 333 404 322 L 404 172 Q 384 167 350 163 Q 310 158 262 163 Z" fill="#e8e4dc"/>

  <!-- Spine -->
  <rect x="249" y="163" width="14" height="171" fill="#253c2e"/>

  <!-- Left page text lines -->
  <rect x="130" y="194" width="102" height="5" rx="2.5" fill="#ccc8be"/>
  <rect x="130" y="211" width="86"  height="4" rx="2"   fill="#d8d4ca"/>
  <rect x="130" y="225" width="94"  height="4" rx="2"   fill="#d8d4ca"/>
  <rect x="130" y="239" width="88"  height="4" rx="2"   fill="#d8d4ca"/>
  <rect x="130" y="256" width="102" height="5" rx="2.5" fill="#ccc8be"/>
  <rect x="130" y="273" width="80"  height="4" rx="2"   fill="#d8d4ca"/>
  <rect x="130" y="287" width="90"  height="4" rx="2"   fill="#d8d4ca"/>
  <rect x="130" y="301" width="76"  height="4" rx="2"   fill="#d8d4ca"/>
  <rect x="130" y="315" width="68"  height="4" rx="2"   fill="#d8d4ca"/>

  <!-- Right page text lines -->
  <rect x="280" y="194" width="106" height="5" rx="2.5" fill="#d0ccc2"/>
  <rect x="280" y="211" width="90"  height="4" rx="2"   fill="#dedad0"/>
  <rect x="280" y="225" width="98"  height="4" rx="2"   fill="#dedad0"/>
  <rect x="280" y="239" width="84"  height="4" rx="2"   fill="#dedad0"/>
  <rect x="280" y="256" width="106" height="5" rx="2.5" fill="#d0ccc2"/>
  <rect x="280" y="273" width="86"  height="4" rx="2"   fill="#dedad0"/>
  <rect x="280" y="287" width="96"  height="4" rx="2"   fill="#dedad0"/>

  <!-- Book cover bottom thickness -->
  <path d="M 108 322 Q 108 340 122 342 L 390 342 Q 404 340 404 322 L 404 334 Q 404 346 390 348 L 122 348 Q 108 346 108 334 Z" fill="#1a2e22"/>

  <!-- Whisk handle (thick diagonal line, bottom-right toward center) -->
  <line x1="396" y1="418" x2="248" y2="232" stroke="#f5a623" stroke-width="22" stroke-linecap="round"/>

  <!-- Whisk neck ring -->
  <ellipse cx="234" cy="218" rx="18" ry="12" fill="#f5a623" transform="rotate(-42 234 218)"/>

  <!-- Whisk wires fanning up-left from neck -->
  <path d="M 216 206 Q 166 168 162 116" fill="none" stroke="#f5a623" stroke-width="11" stroke-linecap="round"/>
  <path d="M 224 200 Q 190 155 198  98" fill="none" stroke="#f5a623" stroke-width="11" stroke-linecap="round"/>
  <path d="M 234 196 Q 216 148 236  90" fill="none" stroke="#f5a623" stroke-width="11" stroke-linecap="round"/>
  <path d="M 244 196 Q 240 148 268  96" fill="none" stroke="#f5a623" stroke-width="11" stroke-linecap="round"/>
  <path d="M 252 200 Q 268 158 298 108" fill="none" stroke="#f5a623" stroke-width="11" stroke-linecap="round"/>

  <!-- Whisk cross-brace wires -->
  <path d="M 168 148 Q 216 134 266 144" fill="none" stroke="#f5a623" stroke-width="9" stroke-linecap="round"/>
  <path d="M 172 120 Q 218 104 268 116" fill="none" stroke="#f5a623" stroke-width="8" stroke-linecap="round"/>

</svg>
