<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Recipe Book</title>
    <meta name="description" content="Your own recipe collection">
    <meta name="theme-color" content="#111315">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <!-- Home screen icon on iPhone. Opaque and square: iOS rounds the corners
         itself and paints any transparency black. -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Recipes">
    <link rel="preload" href="fonts/sofia-sans-condensed.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/hanken-grotesk.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div id="app" data-route="boot">
        <div class="boot"><p>Loading…</p></div>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <noscript>This app needs JavaScript.</noscript>
    <script type="module" src="js/main.js"></script>
</body>
</html>
